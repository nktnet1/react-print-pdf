name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Bun for compatibility tests
        uses: oven-sh/setup-bun@v2

      - name: Check formatting and lint
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install PDF inspection utilities
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Smoke test installed CJS/ESM, TypeScript, optional peer and Chromium
        run: pnpm test:verdaccio

      - name: Upload combined Node and browser coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/combined/
          if-no-files-found: warn
          retention-days: 14

  gotenberg-integration:
    # Docker image startup stays out of PR checks, but main releases must pass.
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PDF inspection utilities
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Test against real Gotenberg Chromium
        run: pnpm test:gotenberg
